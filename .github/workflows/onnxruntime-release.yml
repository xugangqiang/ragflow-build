name: onnxruntime release

# Build scripts live in onnxruntime/ (one directory per vendored dependency).
# GitHub only loads workflows from .github/workflows, hence this file lives
# here while everything it executes lives under onnxruntime/.

on:
  push:
    tags:
      # The tag carries the version: pushing release-v1.30.0 builds and
      # publishes onnxruntime v1.30.0. The onnxruntime-v* form is accepted too,
      # and is the safer choice once this repo vendors more than one dependency.
      - 'release-v*'
      - 'onnxruntime-v*'
  workflow_dispatch:
    inputs:
      ort_version:
        description: 'onnxruntime tag to build (default: onnxruntime/ORT_VERSION)'
        required: false
        default: ''
      dry_run:
        description: 'Build only, do not publish a GitHub release'
        type: boolean
        default: false
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # keep in sync with onnxruntime/ORT_VERSION when bumping manually
  ORT_PKG: onnxruntime

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve onnxruntime version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.ort_version }}
        run: |
          set -euo pipefail
          # 1. tag push: the tag name carries the version
          # 2. manual run: the ort_version input
          # 3. fallback: whatever is pinned in onnxruntime/ORT_VERSION
          version=""
          case "$REF_NAME" in
            release-v*)     version="${REF_NAME#release-}" ;;
            onnxruntime-v*) version="${REF_NAME#onnxruntime-}" ;;
          esac
          [ -n "$version" ] || version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < "${{ env.ORT_PKG }}/ORT_VERSION")"

          pinned="$(tr -d '[:space:]' < "${{ env.ORT_PKG }}/ORT_VERSION")"
          if [ "$version" != "$pinned" ]; then
            echo "::warning::building $version but ${ORT_PKG}/ORT_VERSION pins $pinned"
            echo "::warning::run 'onnxruntime/scripts/bump.sh $version' and commit to keep them in sync"
          fi

          case "$version" in
            v*) : ;;
            *) echo "::error::version '$version' must start with 'v' (e.g. v1.29.0)"; exit 1 ;;
          esac

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "onnxruntime version: $version (trigger: ${{ github.event_name }}, ref: $REF_NAME)"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          # Native arm64 runner. If your repo has no access to arm runners,
          # change os to ubuntu-latest: onnxruntime/build.sh then falls back to
          # aarch64 cross compilation (see scripts/cross-linux-aarch64.sh).
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: osx-arm64
            os: macos-latest
          - target: osx-universal
            os: macos-latest
          # Windows is disabled for now: the runner image has no Visual Studio
          # instance, so CMake configure dies with
          #   Generator "Visual Studio 17 2022" could not find any instance of
          #   Visual Studio.
          # onnxruntime/build.sh already supports both windows-x64 and
          # windows-arm64; uncomment these once a runner with the MSVC
          # toolchain (and vcvarsall / lib.exe for packaging) is available.
          # - target: windows-x64
          #   os: windows-latest
          # - target: windows-arm64
          #   os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Ninja (unix)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'windows-arm64' && 'amd64_arm64' || 'x64' }}

      - name: Fetch onnxruntime ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ needs.prepare.outputs.version }}" > "${{ env.ORT_PKG }}/ORT_VERSION"
          bash "${{ env.ORT_PKG }}/scripts/init-submodules.sh"

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          # Equivalent to:
          #   --config Release
          #   --cmake_extra_defines onnxruntime_BUILD_SHARED_LIB=OFF
          #   --minimal_build --disable_contrib_ops --disable_ml_ops
          #   --disable_rtti --disable_exceptions --parallel
          bash "${{ env.ORT_PKG }}/build.sh" --target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ matrix.target }}
          path: |
            ${{ env.ORT_PKG }}/dist/*.tar.gz
            ${{ env.ORT_PKG }}/dist/*.zip
            ${{ env.ORT_PKG }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [prepare, build]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('onnxruntime-{0}', needs.prepare.outputs.version) || github.ref_name }}
          name: onnxruntime ${{ needs.prepare.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            Customized onnxruntime ${{ needs.prepare.outputs.version }} build.

            Configuration: `Release`, static library (`onnxruntime_BUILD_SHARED_LIB=OFF`),
            `--minimal_build --disable_contrib_ops --disable_ml_ops --disable_rtti --disable_exceptions`.

            | Artifact | Platform | Arch |
            | --- | --- | --- |
            | `onnxruntime-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz` | Linux | x86_64 |
            | `onnxruntime-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz` | Linux | aarch64 |
            | `onnxruntime-${{ needs.prepare.outputs.version }}-osx-arm64.tar.gz` | macOS | arm64 |
            | `onnxruntime-${{ needs.prepare.outputs.version }}-osx-universal.tar.gz` | macOS | arm64 + x86_64 |
            <!-- Windows entries return once the windows-x64 / windows-arm64
                 matrix rows are re-enabled. -->
